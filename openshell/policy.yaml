version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  codex:
    name: codex
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: tcp
      - host: auth.openai.com
        port: 443
      - host: chatgpt.com
        port: 443
    binaries:
      - path: /usr/bin/codex
      - path: /usr/bin/node
      - path: "/usr/lib/node_modules/@openai/**"
      - path: /sandbox/.codex/packages/app-server-daemon/releases/0.162.1-aarch64-unknown-linux-musl/bin/codex
  project_git:
    name: claude-oci-marketplace-git
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /dmartinol/claude-oci-marketplace-poc.git/info/refs*
      - allow:
          method: POST
          path: /dmartinol/claude-oci-marketplace-poc.git/git-upload-pack
      - allow:
          method: POST
          path: /dmartinol/claude-oci-marketplace-poc.git/git-receive-pack
    binaries:
    - path: /usr/bin/git
    - path: /usr/lib/git-core/git-remote-https
    - path: /usr/lib/git-core/git-remote-http
  project_github_api:
    name: claude-oci-marketplace-api
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /
      - allow:
          method: GET
          path: /user
      - allow:
          method: '*'
          path: /repos/dmartinol/claude-oci-marketplace-poc
      - allow:
          method: '*'
          path: /repos/dmartinol/claude-oci-marketplace-poc/**
    binaries:
    - path: /usr/bin/gh
  claude_vertex:
    name: claude-google-vertex-ai
    endpoints:
    - host: aiplatform.googleapis.com
      port: 443
    - host: oauth2.googleapis.com
      port: 443
    binaries:
    - path: /usr/local/bin/claude
  claude_anthropic:
    name: claude-anthropic-api
    endpoints:
    - host: api.anthropic.com
      port: 443
    binaries:
    - path: /usr/local/bin/claude
  quay:
    name: skillctl-quay
    endpoints:
    - host: quay.io
      port: 443
    binaries:
    - path: /usr/local/bin/skillctl
